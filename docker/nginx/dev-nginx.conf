events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    client_max_body_size 50M;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # SSL global settings
    ssl_certificate /etc/nginx/certs/worldpinball.local.crt;
    ssl_certificate_key /etc/nginx/certs/worldpinball.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # WebSocket connection upgrade mapping for SignalR and Angular HMR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # Upstreams targeting local host development services (Kestrel / Angular)
    # -------------------------------------------------------------------------
    upstream bff_upstream {
        server host.docker.internal:5285; # Kestrel BFF HTTP local
        keepalive 32;
    }

    upstream api_upstream {
        server api:8080;                  # Containerized API
        server host.docker.internal:5085 backup; # Kestrel Core API HTTP local fallback
        keepalive 32;
    }

    upstream auth_upstream {
        server keycloak:8080;             # Keycloak internal container
        server host.docker.internal:8081 backup; # Keycloak exposed on host port
        keepalive 32;
    }

    upstream frontend_upstream {
        server host.docker.internal:4200; # Angular dev server (ng serve)
        keepalive 32;
    }

    # Common reverse proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS redirect for all *.worldpinball.local domains
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name worldpinball.local *.worldpinball.local;
        return 301 https://$host$request_uri;
    }

    # 1. AUTH DOMAIN: auth.worldpinball.local (Keycloak IAM)
    server {
        listen 443 ssl;
        server_name auth.worldpinball.local;

        location / {
            proxy_pass http://auth_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # 2. CORE API DOMAIN: api.worldpinball.local (Backend Core API)
    server {
        listen 443 ssl;
        server_name api.worldpinball.local;

        location / {
            proxy_pass http://api_upstream;
        }
    }

    # 3. BFF DOMAIN: bff.worldpinball.local (Gateway & SignalR Hubs)
    server {
        listen 443 ssl;
        server_name bff.worldpinball.local;

        # SignalR WebSockets (Lobby / Telemetry Hubs)
        location /hubs/ {
            proxy_pass http://bff_upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://bff_upstream;
        }
    }

    # 4. FRONTEND DOMAIN: worldpinball.local (Angular SPA)
    server {
        listen 443 ssl;
        server_name worldpinball.local;

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}

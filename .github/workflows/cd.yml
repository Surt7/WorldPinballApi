name: CD Publish Docker Images

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: WorldPinball.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:latest
            ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}

      - name: Build and Push BFF Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: WorldPinball.Bff/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/bff:latest
            ghcr.io/${{ env.REPO_LC }}/bff:${{ github.sha }}